[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "islandpulse"
version = "0.1.0"
description = "Zero-dependency Python client, CLI and daily archiver for Epic's public Fortnite Data API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Abdulfayyod Mukhamedov" }]
keywords = ["fortnite", "uefn", "fortnite-creative", "analytics", "archive", "dataset"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Games/Entertainment",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/abafaboy/islandpulse"
Issues = "https://github.com/abafaboy/islandpulse/issues"

[project.scripts]
islandpulse = "islandpulse.cli:main"

[tool.setuptools]
packages = ["islandpulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
