name: archive

# Snapshot the Fortnite Data API once a day. The API only serves the last
# 7 days, so every run adds history that cannot be fetched later.
on:
  schedule:
    - cron: "15 2 * * *" # 02:15 UTC daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install islandpulse
        run: pip install .

      - name: Archive tracked islands
        run: islandpulse archive --codes tracked.txt --out data

      - name: Build report
        run: islandpulse report --data data --out site/index.html

      - name: Commit data and report if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "data: daily snapshot $(date -u +%Y-%m-%d)"
            git push
          fi

      # Optional GitHub Pages: set the repository variable ISLANDPULSE_PAGES
      # to "true" and choose "GitHub Actions" as the Pages source.
      - name: Upload site for Pages
        if: vars.ISLANDPULSE_PAGES == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  pages:
    needs: archive
    if: vars.ISLANDPULSE_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
